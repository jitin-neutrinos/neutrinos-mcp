name: Build and Release Vector DB

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Runners are ephemeral — without this, `raw/` is empty on every run and
      # crawl.py's default delta mode (only re-fetches what's missing or
      # changed, see its own --full flag) never has anything to diff against,
      # so "daily" would silently mean "full 25-minute re-crawl, every day".
      # `restore-keys` falls back to the most recent cache from any prior run
      # even though `key` (below) never matches one exactly — a fresh cache is
      # saved under `key` at the end of every run regardless of hit/miss.
      - name: Restore previous crawl cache (raw/)
        uses: actions/cache@v4
        with:
          path: raw
          key: raw-${{ github.run_id }}
          restore-keys: |
            raw-

      # `ingest.index` (stage 4) only assembles data/neutrinos.db from
      # data/topics.jsonl and data/chunks.jsonl — it does not crawl. Those
      # files are produced by stages 1-3 below and are gitignored (never
      # committed), so a fresh checkout has none of them; running index.py
      # alone here would fail with FileNotFoundError on every trigger.
      - name: Crawl documentation.neutrinos.com (stage 1, delta)
        run: python -m neutrinos_mcp.ingest.crawl

      - name: Extract structured content (stage 2)
        run: python -m neutrinos_mcp.ingest.extract

      - name: Chunk (stage 3)
        run: python -m neutrinos_mcp.ingest.chunk

      - name: Build database (stage 4)
        run: python -m neutrinos_mcp.ingest.index

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create Release and Upload DB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: db-${{ env.date }}
          name: Database Update ${{ env.date }}
          files: data/neutrinos.db
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
